# Render Blueprint: tek bir Node web servisi (Socket.IO + build edilmiş client).
# Render → New → Blueprint → bu repo. Oda verisi bellekte tutulur; tek instance çalışmalı.
services:
  - type: web
    name: scrum-poker
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
